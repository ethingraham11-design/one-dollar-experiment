<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>Admin · One Dollar Experiment</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="grain"></div><header class="topbar wrap"><a class="wordmark" href="/">ONE<span>/</span>DOLLAR</a><span class="top-note">PRIVATE ADMIN</span></header><main class="admin wrap"><div class="eyebrow">PAYMENT RECONCILIATION</div><h1>Record a<br><em>verified sale.</em></h1><p class="lede">Only add a transaction after it shows as completed in PayPal Activity. A checkout attempt or return-page visit is not proof of payment.</p><form id="sale-form" class="admin-form"><label for="secret">Admin secret</label><input id="secret" type="password" autocomplete="current-password" required placeholder="Your private admin secret"><label for="transaction">PayPal transaction ID</label><input id="transaction" type="text" required placeholder="Completed transaction ID"><button class="buy-button" type="submit">Record completed $1 purchase <span>↗</span></button><p id="result" class="form-result" role="status"></p></form><a class="text-link" href="/">← View public website</a></main>
<script>const form=document.getElementById('sale-form');form.addEventListener('submit',async e=>{e.preventDefault();const out=document.getElementById('result');out.textContent='Checking…';try{const r=await fetch('/.netlify/functions/record-sale',{method:'POST',headers:{'Content-Type':'application/json','x-admin-secret':document.getElementById('secret').value},body:JSON.stringify({transaction_id:document.getElementById('transaction').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not record transaction');out.textContent=d.duplicate?'This transaction was already counted.':'Purchase recorded. The public counter will update shortly.';if(!d.duplicate)document.getElementById('transaction').value='';}catch(err){out.textContent=err.message;}});</script></body></html>
